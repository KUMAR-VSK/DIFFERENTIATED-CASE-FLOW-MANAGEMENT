# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dcm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=foreign_key_checks=0}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.platform=mysql

server.port=8080

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:dcm-super-secret-key-change-in-production-must-be-at-least-256-bits-long}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==========================================
# Springdoc / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================
# Logging
# ==========================================
logging.level.com.example.dcm=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n